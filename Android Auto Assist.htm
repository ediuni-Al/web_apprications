<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-2.5 sticky top-0 z-30 shadow-lg space-y-2">
    <!-- 1段目: タイトル -->
    <div class="flex items-center justify-between">
      <h1 class="text-base font-bold text-blue-400 flex items-center gap-1">🚗 AutoNav</h1>
      <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-2.5 py-1 rounded-xl text-xs font-bold text-white shadow">🔄 更新</button>
    </div>
    
    <!-- 2段目: ルートショートカットボタン群 -->

      <button onclick="navigateToFukuokaHome()" class="bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white font-bold px-2.5 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow transition-all">
        🏠 福岡宅
      </button>

        🏠 福岡IC→自宅
      </button>
      <button onclick="navigateHomeViaIC('太宰府IC')" class="bg-amber-700 hover:bg-amber-600 active:scale-95 text-white font-bold px-2.5 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow transition-all">
        🏠 太宰府IC→自宅
      </button>
    </div>
  </header>

  <!-- モバイル用 タブコンテナ -->
  <div id="tabContainer" class="flex md:hidden flex-wrap gap-1.5 p-3 bg-slate-800/90 border-b border-slate-700/80 sticky top-[85px] z-20 backdrop-blur-md shadow-md"></div>

  <main class="p-2.5 md:p-6 max-w-[1600px] mx-auto mt-1 md:mt-0">

    <!-- PC表示 -->

        <h2 class="text-lg font-bold text-white pb-2 border-b border-slate-700">新規スポット追加</h2>
        
        <form id="addFormPC" onsubmit="submitData(event, 'PC')" class="space-y-4">

            <label class="block text-xs font-bold text-slate-400 mb-1">分類タグ</label>

              <button type="button" onclick="setCategoryTag('うどん', 'PC')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-bold">うどん</button>
              <button type="button" onclick="setCategoryTag('今回の旅', 'PC')" class="px-2 py-1 bg-blue-900/60 border border-blue-700 hover:bg-blue-800 text-blue-200 rounded-lg text-xs font-bold">今回の旅</button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">スポット名 (例: 01_ホテル)</label>
            <div class="flex gap-2">

              <button type="button" onclick="openGoogleMaps('pc_title')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap shadow flex items-center gap-1">🔍 Map</button>
            </div>

            <label class="block text-xs font-bold text-slate-400 mb-1">住所 または 検索用テキスト</label>
            <input type="text" id="pc_location" required placeholder="マップでコピーした住所等を貼り付け" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-sm text-white outline-none focus:border-blue-500">

            </div>
          </div>

            <label class="block text-xs font-bold text-slate-400 mb-1">高速道路利用設定</label>
            <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-700">

  <!-- 編集モーダル -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-3 shadow-2xl">

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-p_Hohys48vgeQnVg3Rdj_qIW78PCCA4yu_tSLXCndihU5RVZkxdj_2y2rNIbCp-d/exec";
    const HOME_ADDRESS = "鹿児島市桜ヶ丘3丁目16-3";
    const FUKUOKA_HOME_ADDRESS = "福岡県福岡市博多区石城町７−９";
    let allData = [];
    let currentTab = "";
    let pcFilterTab = "ALL";
    let userLat = null, userLng = null;
    let pressTimer = null;
    let isLongPress = false;

    if (window.innerWidth < 768 && navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        if (allData.length > 0) renderAll();
      }, err => console.warn(err), { enableHighAccuracy: true });
    }

    function openMobileAddModal() {
      document.getElementById('mb_tab_group').value = currentTab || '今回の旅';
      document.getElementById('mobileAddModal').classList.remove('hidden');
    }

    function closeMobileAddModal() {
      document.getElementById('mobileAddModal').classList.add('hidden');
    }

    function navigateToFukuokaHome() {
      const destEnc = encodeURIComponent(FUKUOKA_HOME_ADDRESS);
      openAppOrUrl(`https://www.google.com/maps/dir/?api=1&destination=${destEnc}&travelmode=driving&avoid=h`);
    }

    function navigateHomeViaIC(icName) {
      const homeEnc = encodeURIComponent(HOME_ADDRESS);
      const icEnc = encodeURIComponent(icName);
      openAppOrUrl(`https://www.google.com/maps/dir/?api=1&destination=${homeEnc}&waypoints=${icEnc}&travelmode=driving&avoid=h`);
    }

    function openGoogleMaps(inputId) {
      const val = document.getElementById(inputId).value.trim();
      if (!val) return alert('スポット名を入力してください');
      openNativeMapApp(val);
    }

    // アプリを確実に起動するための制御関数（ポップアップブロック回避＆アプリ直接開く）
    function openNativeMapApp(queryText) {
      if (!queryText) return;
      const encoded = encodeURIComponent(queryText);
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Android向け Intent URI
        window.location.href = `intent://maps.google.com/maps?q=${encoded}#Intent;scheme=https;package=com.google.android.apps.maps;end`;
      } else {
        // iOS / Web向け URL（Google Maps アプリがインストールされていれば自動遷移）
        window.location.href = `https://maps.google.com/maps?q=${encoded}`;
      }
    }

    // ナビ・ルート起動用
    function openAppOrUrl(url) {
      window.location.href = url;
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function resolveRouteRule(item) {
      const setting = String(item.avoid_highways).toUpperCase().trim();
      const targetLat = parseFloat(item.lat);
      const targetLng = parseFloat(item.lng);
      const dist = (userLat && userLng && !isNaN(targetLat) && !isNaN(targetLng)) ? getDistanceKm(userLat, userLng, targetLat, targetLng) : null;

      let avoid = false;
      if (setting === 'TRUE') avoid = true;
      else if (setting === 'FALSE') avoid = false;
      else avoid = (dist !== null) ? (dist < 50.0) : true;

      return { avoid };
    }

    function parseDateTag(tag) {
      if (!tag) return null;
      const normalized = tag.trim().replace(/\./g, '/').replace(/-/g, '/');
      
      const mdMatch = normalized.match(/^(\d{1,2})\/(\d{1,2})$/);
      if (mdMatch) {
        const m = parseInt(mdMatch[1], 10);
        const d = parseInt(mdMatch[2], 10);
        if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          return new Date(2026, m - 1, d);
        }
      }

      const ymdMatch = normalized.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      if (ymdMatch) {
        const y = parseInt(ymdMatch[1], 10);
        const m = parseInt(ymdMatch[2], 10);
        const d = parseInt(ymdMatch[3], 10);
        return new Date(y, m - 1, d);
      }

      const parsed = Date.parse(normalized);
      return !isNaN(parsed) ? new Date(parsed) : null;
    }

    async function loadData() {
      try {
        const res = await fetch(GAS_WEBAPP_URL);
        allData = await res.json();
        
        const existingTabs = [...new Set(allData.map(item => String(item.tab_group || '今回の旅')))];
        
        const sortedTabs = existingTabs.sort((a, b) => {
          const dateA = parseDateTag(a);
          const dateB = parseDateTag(b);

          if (dateA && dateB) return dateA - dateB;
          if (dateA && !dateB) return -1;
          if (!dateA && dateB) return 1;

          return a.localeCompare(b, 'ja');
        });

        if (!currentTab || !sortedTabs.includes(currentTab)) {
          currentTab = sortedTabs[0] || '今回の旅';
        }
        
        renderTabs(sortedTabs);
        renderPCFilterTabs(existingTabs);
        renderAll();
      } catch(e) {
        console.error("データ読み込みエラー:", e);
      }
    }

    function renderTabs(tabs) {
      document.getElementById('tabContainer').innerHTML = tabs.map(tab => `
        <button onclick="switchTab('${tab}')" class="px-3.5 py-1.5 rounded-xl font-bold text-xs border transition-all ${
          currentTab === tab ? 'bg-blue-600 text-white border-blue-400 shadow-md scale-105' : 'bg-slate-800 text-slate-400 border-slate-700'
        }">${tab}</button>
      `).join('');
    }

    function renderPCFilterTabs(rawTabs) {
      const uniqueTabs = [...new Set(rawTabs)];
      
      const sortedTabs = uniqueTabs.sort((a, b) => {
        const dateA = parseDateTag(a);
        const dateB = parseDateTag(b);

        if (dateA && dateB) return dateA - dateB;
        if (dateA && !dateB) return -1;
        if (!dateA && dateB) return 1;

        return a.localeCompare(b, 'ja');
      });

      const allTabs = ['ALL', ...sortedTabs];

      document.getElementById('pcFilterContainer').innerHTML = allTabs.map(tab => `
        <button onclick="switchPCFilter('${tab}')" class="px-2.5 py-1 rounded-lg font-bold text-xs border transition-all ${
          pcFilterTab === tab ? 'bg-blue-600 text-white border-blue-400 shadow' : 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'
        }">${tab}</button>
      `).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const existingTabs = [...new Set(allData.map(item => String(item.tab_group || '今回の旅')))];
      const sortedTabs = existingTabs.sort((a, b) => {
        const dateA = parseDateTag(a);
        const dateB = parseDateTag(b);
        if (dateA && dateB) return dateA - dateB;
        if (dateA && !dateB) return -1;
        if (!dateA && dateB) return 1;
        return a.localeCompare(b, 'ja');
      });
      renderTabs(sortedTabs);
      renderAll();
    }

    function switchPCFilter(tab) {
      pcFilterTab = tab;
      renderPCFilterTabs([...new Set(allData.map(item => String(item.tab_group || '今回の旅')))]);
      renderPCTable();
    }

    function setCategoryTag(tagName, target = 'PC') {
      document.getElementById(target === 'PC' ? 'pc_tab_group' : 'mb_tab_group').value = tagName;
    }

    function renderAll() {
      renderMobileTiles();
      renderPCTable();
    }

    // モバイル表示：タイルの描画
    function renderMobileTiles() {
      const filtered = allData.filter(item => String(item.tab_group || '今回の旅') === currentTab);
      
      filtered.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'ja', { numeric: true }));

      document.getElementById('mobileTileGrid').innerHTML = filtered.map(item => {
        const route = resolveRouteRule(item);
        const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.location)}&travelmode=driving${route.avoid ? '&avoid=h' : ''}`;
        const searchQuery = item.title || item.location;

        return `
          <div 
            ontouchstart="handleTouchStart(event, '${searchQuery.replace(/'/g, "\\'")}')" 
            ontouchend="handleTouchEnd(event, '${navUrl}')" 
            ontouchmove="handleTouchMove()"
            onmousedown="handleMouseDown(event, '${searchQuery.replace(/'/g, "\\'")}')"
            onmouseup="handleMouseUp(event, '${navUrl}')"
            class="flex items-center gap-2 p-3.5 bg-gradient-to-br from-slate-800 to-slate-850 active:from-blue-700 active:to-blue-900 border border-slate-700/80 active:border-blue-400 rounded-2xl shadow-md transition-all active:scale-95 min-h-[64px] cursor-pointer select-none">
            <span class="text-blue-400 text-base shrink-0 pointer-events-none">📍</span>
            <span class="text-sm font-bold text-white leading-snug line-clamp-2 pointer-events-none">${item.title}</span>
          </div>
        `;
      }).join('');
    }

    // タッチ＆マウス操作ハンドラ
    function handleTouchStart(e, query) {
      isLongPress = false;
      pressTimer = setTimeout(() => { 
        isLongPress = true; 
        if (navigator.vibrate) navigator.vibrate(50); 
        openNativeMapApp(query); 
      }, 500);
    }
    function handleTouchMove() { clearTimeout(pressTimer); }
    function handleTouchEnd(e, navUrl) { 
      clearTimeout(pressTimer); 
      if (!isLongPress) openAppOrUrl(navUrl); 
    }
    function handleMouseDown(e, query) { 
      if ('ontouchstart' in window) return; 
      isLongPress = false; 
      pressTimer = setTimeout(() => { isLongPress = true; openNativeMapApp(query); }, 500); 
    }
    function handleMouseUp(e, navUrl) { 
      if ('ontouchstart' in window) return; 
      clearTimeout(pressTimer); 
      if (!isLongPress) openAppOrUrl(navUrl); 
    }

    // PC用テーブル描画
    function renderPCTable() {
      const tbody = document.getElementById('pcDataTable');
      let list = allData.filter(item => (pcFilterTab === 'ALL') || String(item.tab_group || '今回の旅') === pcFilterTab);
      
      list.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'ja', { numeric: true }));

      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) selectAllCb.checked = false;

      tbody.innerHTML = list.map(row => {
        const ruleSetting = String(row.avoid_highways).toUpperCase();
        let ruleBadgeClass = 'bg-slate-700 text-slate-300';
        let ruleText = 'AUTO (50km判定)';

        if (ruleSetting === 'TRUE') {
          ruleBadgeClass = 'bg-emerald-950 text-emerald-400 border border-emerald-800';
          ruleText = '下道優先';
        } else if (ruleSetting === 'FALSE') {
          ruleBadgeClass = 'bg-indigo-950 text-indigo-400 border border-indigo-800';
          ruleText = '高速優先';
        }

        const safeTitle = (row.title || '').replace(/'/g, "\\'");
        const safeLocation = (row.location || '').replace(/'/g, "\\'");

        return `
          <tr class="hover:bg-slate-700/30 transition-colors">
            <td class="p-3 text-center">
              <input type="checkbox" value="${row.rowIndex}" class="row-checkbox w-4 h-4 accent-blue-600 cursor-pointer">
            </td>
            <td class="p-3 whitespace-nowrap"><span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-xs border border-slate-600 font-semibold">${row.tab_group}</span></td>
            <td class="p-3 font-bold text-white whitespace-nowrap">
              <span onclick="openNativeMapApp('${safeTitle}')" class="cursor-pointer hover:text-blue-400 hover:underline transition-colors" title="Google Mapで検索">
                ${row.title}
              </span>
            </td>
            <td class="p-3 text-xs text-slate-400 truncate max-w-[240px]">
              <span onclick="openNativeMapApp('${safeLocation}')" class="cursor-pointer hover:text-blue-400 hover:underline transition-colors" title="${row.location} (Google Mapで表示)">
                ${row.location}
              </span>
            </td>
            <td class="p-3 text-xs whitespace-nowrap">
              <span class="px-2 py-1 rounded-lg text-xs font-medium ${ruleBadgeClass}">${ruleText}</span>
            </td>
            <td class="p-3 text-xs text-slate-400 truncate max-w-[180px]" title="${row.memo || ''}">${row.memo || '-'}</td>
            <td class="p-3 text-center whitespace-nowrap">
              <div class="flex justify-center gap-1">
                <button onclick="duplicateSpot(${row.rowIndex})" title="内容をフォームに展開" class="bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-800 px-2 py-1 rounded-lg text-xs font-bold transition-all">複製</button>
                <button onclick="openEditModal(${row.rowIndex})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded-lg text-xs font-bold border border-slate-600 transition-all">編集</button>
                <button onclick="deleteSpot(${row.rowIndex}, '${safeTitle}')" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800 px-2 py-1 rounded-lg text-xs font-bold transition-all">削除</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleSelectAll(master) {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = master.checked);
    }

    function duplicateSpot(rowIndex) {
      const item = allData.find(d => d.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById('pc_tab_group').value = item.tab_group || '';
      document.getElementById('pc_title').value = item.title || '';
      document.getElementById('pc_location').value = item.location || '';
      document.getElementById('pc_lat').value = item.lat || '';
      document.getElementById('pc_lng').value = item.lng || '';
      document.getElementById('pc_memo').value = item.memo || '';
      setAvoidRule(item.avoid_highways || 'AUTO', 'PC');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function duplicateSelectedWithTag() {
      const selectedCbs = Array.from(document.querySelectorAll('.row-checkbox:checked'));
      if (selectedCbs.length === 0) {
        alert('複製したいスポットにチェックを入れてください。');
        return;
      }

      const targetTag = prompt(`選択した ${selectedCbs.length} 件のスポットを複製します。\n付与する分類タグを入力してください:`, '今回の旅');
      if (targetTag === null || targetTag.trim() === '') return;

      const selectedIndices = selectedCbs.map(cb => parseInt(cb.value, 10));
      const targetItems = allData.filter(item => selectedIndices.includes(item.rowIndex));

      for (const item of targetItems) {
        await sendGasRequest({
          action: 'add',
          tab_group: targetTag.trim(),
          title: item.title || '',
          location: item.location || '',
          lat: item.lat || '',
          lng: item.lng || '',
          avoid_highways: item.avoid_highways || 'AUTO',
          memo: item.memo || ''
        });
      }

      setTimeout(loadData, 800);
    }

    async function deleteSelected() {
      const selectedCbs = Array.from(document.querySelectorAll('.row-checkbox:checked'));
      if (selectedCbs.length === 0) {
        alert('削除したいスポットにチェックを入れてください。');
        return;
      }

      if (!confirm(`選択した ${selectedCbs.length} 件のスポットを削除してもよろしいですか？`)) return;

      const rowIndices = selectedCbs.map(cb => parseInt(cb.value, 10)).sort((a, b) => b - a);

      for (const idx of rowIndices) {
        await sendGasRequest({ action: 'delete', rowIndex: idx });
      }

      setTimeout(loadData, 800);
    }

    async function deleteAllSpots() {
      const filteredData = allData.filter(item => (pcFilterTab === 'ALL') || String(item.tab_group || '今回の旅') === pcFilterTab);
      
      if (filteredData.length === 0) return alert('削除できるデータがありません。');

      if (!confirm(`【確認】現在表示中の ${filteredData.length} 件のスポットを削除してもよろしいですか？`)) return;

      const targetIndices = filteredData.map(d => d.rowIndex).sort((a, b) => b - a);

      for (const idx of targetIndices) {
        await sendGasRequest({ action: 'delete', rowIndex: idx });
      }

      setTimeout(loadData, 800);
    }

    function setAvoidRule(rule, target = 'PC') {
      const prefix = target === 'PC' ? 'pc' : 'mb';
      document.getElementById(`${prefix}_avoid_highways`).value = rule;
      document.querySelectorAll(`.rule-btn-${prefix}`).forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`${prefix}-rule-${rule}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow');
        activeBtn.classList.remove('text-slate-400');
      }
    }

    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

    function openEditModal(rowIndex) {
      const item = allData.find(d => d.rowIndex === rowIndex);
      if (!item) return;
      document.getElementById('editRowIndex').value = rowIndex;
      document.getElementById('editTab').value = item.tab_group || '';
      document.getElementById('editTitle').value = item.title || '';
      document.getElementById('editLocation').value = item.location || '';
      document.getElementById('editLat').value = item.lat || '';
      document.getElementById('editLng').value = item.lng || '';
      document.getElementById('editRule').value = item.avoid_highways || 'AUTO';
      document.getElementById('editMemo').value = item.memo || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    async function sendGasRequest(payload) {
      const params = new URLSearchParams();
      for (const key in payload) params.append(key, payload[key]);
      
      await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });
    }

    async function saveEdit() {
      await sendGasRequest({
        action: 'update',
        rowIndex: document.getElementById('editRowIndex').value,
        tab_group: document.getElementById('editTab').value,
        title: document.getElementById('editTitle').value,
        location: document.getElementById('editLocation').value,
        lat: document.getElementById('editLat').value,
        lng: document.getElementById('editLng').value,
        avoid_highways: document.getElementById('editRule').value,
        memo: document.getElementById('editMemo').value
      });
      closeEditModal();
      setTimeout(loadData, 800);
    }

    async function deleteSpot(rowIndex, title = '') {
      if (!confirm(title ? `「${title}」を削除してもよろしいですか？` : 'このスポットを削除してもよろしいですか？')) return;
      await sendGasRequest({ action: 'delete', rowIndex: rowIndex });
      closeEditModal();
      setTimeout(loadData, 800);
    }

    function deleteFromModal() {
      const rowIndex = document.getElementById('editRowIndex').value;
      const title = document.getElementById('editTitle').value;
      if (rowIndex) deleteSpot(rowIndex, title);
    }

    async function submitData(e, target = 'PC') {
      e.preventDefault();
      const prefix = target === 'PC' ? 'pc' : 'mb';

      await sendGasRequest({
        action: 'add',
        tab_group: document.getElementById(`${prefix}_tab_group`).value,
        title: document.getElementById(`${prefix}_title`).value,
        location: document.getElementById(`${prefix}_location`).value,
        lat: document.getElementById(`${prefix}_lat`).value,
        lng: document.getElementById(`${prefix}_lng`).value,
        avoid_highways: document.getElementById(`${prefix}_avoid_highways`).value,
        memo: document.getElementById(`${prefix}_memo`).value
      });

      document.getElementById(`addForm${target}`).reset();
      setAvoidRule('AUTO', target);
      if (target === 'Mobile') closeMobileAddModal();
      setTimeout(loadData, 800);
    }

    window.addEventListener('resize', () => { renderAll(); });
    loadData();
  </script>
</body>
</html>
