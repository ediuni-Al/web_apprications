<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🖌筆談くんneo</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: #000; color: #fff; overflow: hidden; }

/* 全体レイアウト */
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

/* 上段：患者に見せる巨大表示エリア */
#display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh 4vw; background: #000; position: relative; overflow-y: auto; }
#shown { white-space: pre-wrap; word-break: break-word; line-height: 1.3; width: 100%; text-align: left; font-size: 7vh; font-weight: bold; }
#shown.empty { opacity: 0; }

/* 下段：医師側の操作パネル */
#control-area { height: 180px; background: #1a1a1a; border-top: 2px solid #333; display: flex; flex-direction: column; padding: 8px 12px; gap: 6px; flex-shrink: 0; }

.row { display: flex; gap: 8px; align-items: center; width: 100%; }
.row .sp { flex: 1; }

button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: bold; color: #fff; background: #333; transition: background 0.2s; }
button:active { transform: scale(0.98); }

#micBtn { flex: 2; background: #1a73e8; font-size: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; }
#micBtn.recording { background: #d93025 !important; animation: pulse 1.2s infinite; }

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

#exitBtn { background: #444; font-size: 14px; padding: 8px 12px; }
#clearBtn { background: #555; font-size: 15px; padding: 8px 14px; }
#manageBtn { background: #333; font-size: 14px; padding: 8px 12px; }

/* 定型文チップエリア */
.chips-container { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; align-items: center; width: 100%; }
.chips-container::-webkit-scrollbar { height: 3px; }
.chips-container::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
.chip { background: #2c2c2c; border: 1px solid #555; border-radius: 16px; padding: 5px 12px; font-size: 14px; color: #eee; flex-shrink: 0; }
.chip:active { background: #4a90e2; }

.status-text { font-size: 12px; color: #aaa; }

/* 定型文管理モーダル */
#modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
#modal.show { display: flex; }
.modal-content { background: #222; width: 90vw; max-width: 600px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; padding: 20px; gap: 12px; border: 1px solid #444; }
.modal-header { font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.phrase-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 8px 12px; border-radius: 8px; font-size: 15px; }
.phrase-item button { background: #d93025; font-size: 13px; padding: 4px 10px; }
.modal-footer { display: flex; gap: 8px; align-items: center; }
.modal-footer input { flex: 1; padding: 10px; font-size: 15px; border-radius: 8px; border: 1px solid #555; background: #111; color: #fff; }
</style>
</head>
<body>

<div id="app">
  <!-- 上段：患者用ディスプレイ -->
  <div id="display-area">
    <div id="shown" class="empty"></div>
  </div>

  <!-- 下段：操作パネル -->
  <div id="control-area">
    <div class="chips-container" id="chips"></div>

    <div class="row">
      <button id="micBtn">🎤 話す間押し続ける (音声入力)</button>
      <button id="clearBtn">画面消去</button>
      <button id="manageBtn">⚙ 定型文編集</button>
      <span class="status-text" id="statusMsg">待機中</span>
      <span class="sp"></span>
      <button id="exitBtn">終了</button>
    </div>
  </div>
</div>

<!-- 定型文管理モーダル -->
<div id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span>定型文の編集・管理</span>
      <button id="closeModal" style="background:#555; padding:4px 10px; font-size:14px;">✕ 閉じる</button>
    </div>
    <div class="modal-body" id="phraseList"></div>
    <div class="modal-footer">
      <input type="text" id="newPhraseInput" placeholder="新しい定型文を入力...">
      <button id="addPhraseBtn" style="background:#1a73e8;">追加</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY_PH = 'hitsudan_neo_phrases_v1';
  var $=function(id){return document.getElementById(id)};
  
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  var shown=$('shown');
  var micBtn=$('micBtn');
  var statusMsg=$('statusMsg');
  
  var hasActiveText = false;

  var defaultPhrases = [
    'はい', 'いいえ', '少々お待ちください', 
    '痛みはありますか？', 'これから検査を行います', 
    'レンズを入れ替えます', 'まっすぐ前を見てください', 
    'お疲れ様でした。終わりました。'
  ];
  var phrases = lsGet(KEY_PH, defaultPhrases);

  function showText(text) {
    if(!text || !text.trim()) {
      shown.textContent = '';
      shown.classList.add('empty');
      hasActiveText = false;
    } else {
      shown.textContent = text.trim();
      shown.classList.remove('empty');
      hasActiveText = true;
    }
  }

  function renderChips() {
    var container = $('chips');
    container.innerHTML = '';
    phrases.forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = p;
      btn.onclick = function() {
        showText(p);
      };
      container.appendChild(btn);
    });
  }

  function renderPhraseList() {
    var list = $('phraseList');
    list.innerHTML = '';
    if(phrases.length === 0) {
      list.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">定型文がありません</div>';
      return;
    }
    phrases.forEach(function(p, index){
      var item = document.createElement('div');
      item.className = 'phrase-item';
      
      var span = document.createElement('span');
      span.textContent = p;
      
      var delBtn = document.createElement('button');
      delBtn.textContent = '削除';
      delBtn.onclick = function() {
        phrases.splice(index, 1);
        lsSet(KEY_PH, phrases);
        renderChips();
        renderPhraseList();
      };
      
      item.appendChild(span);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;

  if(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true; 
    recognition.maxAlternatives = 1;

    var finalTranscriptBuffer = '';

    recognition.onstart = function() {
      micBtn.classList.add('recording');
      micBtn.textContent = '🔴 録音中... (話して指を離してください)';
      statusMsg.textContent = '録音中';
      finalTranscriptBuffer = '';
    };

    recognition.onresult = function(event) {
      var interim = '';
      for (var i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalTranscriptBuffer += event.results[i][0].transcript;
        } else {
          interim += event.results[i][0].transcript;
        }
      }
      var currentText = finalTranscriptBuffer + interim;
      if(currentText) {
        showText(currentText.trim());
      }
    };

    recognition.onerror = function(event) {
      console.error(event.error);
      statusMsg.textContent = 'エラー: ' + event.error;
    };

    recognition.onend = function() {
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤 話す間押し続ける (音声入力)';
      statusMsg.textContent = '待機中';
      if(finalTranscriptBuffer) {
        showText(finalTranscriptBuffer.trim());
      }
    };

    var isPressing = false;

    function startRec(e) {
      e.preventDefault();
      if(isPressing) return;
      isPressing = true;

      if(hasActiveText) {
        showText('');
      }

      try {
        recognition.start();
      } catch(err) {}
    }

    function endRec(e) {
      e.preventDefault();
      if(!isPressing) return;
      isPressing = false;
      try {
        recognition.stop();
      } catch(err) {}
    }

    micBtn.addEventListener('mousedown', startRec);
    micBtn.addEventListener('mouseup', endRec);
    micBtn.addEventListener('mouseleave', endRec);

    micBtn.addEventListener('touchstart', startRec, {passive: false});
    micBtn.addEventListener('touchend', endRec, {passive: false});
    micBtn.addEventListener('touchcancel', endRec, {passive: false});

  } else {
    micBtn.disabled = true;
    micBtn.textContent = '🎤 音声非対応ブラウザ';
  }

  $('clearBtn').onclick = function() {
    showText('');
  };

  $('exitBtn').onclick = function() {
    if(confirm('終了しますか？')) {
      window.close();
      location.href = 'about:blank';
    }
  };

  $('manageBtn').onclick = function() {
    renderPhraseList();
    $('modal').classList.add('show');
  };
  $('closeModal').onclick = function() {
    $('modal').classList.remove('show');
  };
  $('addPhraseBtn').onclick = function() {
    var val = $('newPhraseInput').value.trim();
    if(val) {
      phrases.push(val);
      lsSet(KEY_PH, phrases);
      $('newPhraseInput').value = '';
      renderChips();
      renderPhraseList();
    }
  };

  // ページ読み込み時に自動で全画面化を試みる
  function triggerFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function() {
        // ブラウザの制限でブロックされた場合は、最初の画面タッチで全画面化する
      });
    }
  }

  window.addEventListener('load', function() {
    triggerFullscreen();
  });

  // 万が一ロード時の自動全画面がブロックされた場合のフォールバック（画面のどこかをタッチした瞬間に全画面化）
  document.addEventListener('click', function() {
    triggerFullscreen();
  }, { once: true });

  renderChips();
})();
</script>
</body>
</html>
