<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🖌筆談くんneo</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: #fff; color: #000; overflow: hidden; }

/* 全体レイアウト */
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

/* 上段：患者に見せる巨大表示エリア */
#display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh 4vw; background: #fff; color: #000; position: relative; overflow-y: auto; }
#shown { white-space: pre-wrap; word-break: break-word; line-height: 1.3; width: 100%; text-align: left; font-size: 7vh; font-weight: bold; }
#shown.empty { opacity: 0; }

/* 下段：医師側の操作パネル (ナビゲーションバーかぶり防止用に余白確保) */
#control-area { 
  min-height: 190px; 
  background: #1a1a1a; 
  color: #fff;
  border-top: 2px solid #333; 
  display: flex; 
  flex-direction: column; 
  padding: 8px 12px; 
  padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Androidナビゲーションバー対策 */
  gap: 8px; 
  flex-shrink: 0; 
}

.row { display: flex; gap: 8px; align-items: center; width: 100%; }
.row .sp { flex: 1; }

button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: bold; color: #fff; background: #333; transition: background 0.2s; }
button:active { transform: scale(0.98); }

#micBtn { flex: 2; background: #1a73e8; font-size: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; }
#micBtn.recording { background: #d93025 !important; animation: pulse 1.2s infinite; }

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

#questionBtn { background: #e65100; font-size: 18px; padding: 10px 16px; min-width: 50px; }
#exitBtn { background: #444; font-size: 14px; padding: 8px 12px; }
#clearBtn { background: #555; font-size: 15px; padding: 8px 14px; }
#manageBtn, #settingsBtn { background: #333; font-size: 14px; padding: 8px 12px; }

/* 定型文チップエリア */
.chips-container { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; align-items: center; width: 100%; }
.chips-container::-webkit-scrollbar { height: 3px; }
.chips-container::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
.chip { background: #2c2c2c; border: 1px solid #555; border-radius: 16px; padding: 6px 14px; font-size: 15px; color: #eee; flex-shrink: 0; }
.chip:active { background: #4a90e2; }

.status-text { font-size: 12px; color: #aaa; }

/* 共通モーダル */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
.modal.show { display: flex; }
.modal-content { background: #222; width: 90vw; max-width: 600px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; padding: 20px; gap: 12px; border: 1px solid #444; color: #fff; }
.modal-header { font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
.modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.phrase-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 8px 12px; border-radius: 8px; font-size: 15px; }
.phrase-item button { background: #d93025; font-size: 13px; padding: 4px 10px; }
.modal-footer { display: flex; gap: 8px; align-items: center; }
.modal-footer input { flex: 1; padding: 10px; font-size: 15px; border-radius: 8px; border: 1px solid #555; background: #111; color: #fff; }

.setting-row { display: flex; flex-direction: column; gap: 6px; background: #2a2a2a; padding: 12px; border-radius: 8px; }
.setting-row label { font-size: 14px; color: #ccc; }
.setting-row select, .setting-row input[type=range] { width: 100%; padding: 8px; font-size: 16px; border-radius: 6px; background: #111; color: #fff; border: 1px solid #555; }
</style>
</head>
<body>

<div id="app">
  <!-- 上段：患者用ディスプレイ -->
  <div id="display-area">
    <div id="shown" class="empty"></div>
  </div>

  <!-- 下段：操作パネル -->
  <div id="control-area">
    <div class="chips-container" id="chips"></div>

    <div class="row">
      <button id="micBtn">🎤 話す間押し続ける (音声入力)</button>
      <button id="questionBtn" title="文末に？を追加/削除">？</button>
      <button id="clearBtn">画面消去</button>
      <button id="manageBtn">⚙ 定型文</button>
      <button id="settingsBtn">🎨 表示設定</button>
      <span class="status-text" id="statusMsg">待機中</span>
      <span class="sp"></span>
      <button id="exitBtn">終了</button>
    </div>
  </div>
</div>

<!-- 定型文管理モーダル -->
<div id="modal-manage" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span>定型文の編集・管理</span>
      <button class="closeModal" style="background:#555; padding:4px 10px; font-size:14px;">✕ 閉じる</button>
    </div>
    <div class="modal-body" id="phraseList"></div>
    <div class="modal-footer">
      <input type="text" id="newPhraseInput" placeholder="新しい定型文を入力...">
      <button id="addPhraseBtn" style="background:#1a73e8;">追加</button>
    </div>
  </div>
</div>

<!-- 表示設定モーダル -->
<div id="modal-settings" class="modal">
  <div class="modal-content">
    <div class="modal-header
