<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>音声筆談ボード</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: #000; color: #fff; overflow: hidden; }

/* 全体レイアウト */
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

/* 上段：患者に見せる巨大表示エリア (十分な高さを確保) */
#display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh 4vw; background: #000; overflow-y: auto; }
#shown { white-space: pre-wrap; word-break: break-word; line-height: 1.3; width: 100%; text-align: left; font-size: 7vh; font-weight: bold; }
#shown.empty { opacity: 0.25; text-align: center; font-size: 4vh; }

/* 下段：医師側の操作パネル（固定高さ） */
#control-area { height: 180px; background: #1a1a1a; border-top: 2px solid #333; display: flex; flex-direction: column; padding: 8px 12px; gap: 6px; flex-shrink: 0; }

/* 操作ボタン群行 */
.row { display: flex; gap: 8px; align-items: center; width: 100%; }
.row .sp { flex: 1; }

/* ボタン共通デザイン */
button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 10px 16px; font-size: 16px; font-weight: bold; color: #fff; background: #333; transition: background 0.2s; }
button:active { transform: scale(0.98); }

/* 音声認識ボタン（メイン） */
#micBtn { flex: 2; background: #1a73e8; font-size: 18px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; }
#micBtn.recording { background: #d93025 !important; animation: pulse 1.2s infinite; }

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* 終了・全画面・クリアボタン */
#exitBtn { background: #444; font-size: 14px; padding: 8px 12px; }
#clearBtn { background: #555; font-size: 15px; padding: 8px 14px; }

/* 定型文チップエリア */
.chips-container { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; align-items: center; width: 100%; }
.chips-container::-webkit-scrollbar { height: 3px; }
.chips-container::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
.chip { background: #2c2c2c; border: 1px solid #555; border-radius: 16px; padding: 5px 12px; font-size: 14px; color: #eee; flex-shrink: 0; }
.chip:active { background: #4a90e2; }

.status-text { font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<div id="app">
  <!-- 上段：患者用ディスプレイ -->
  <div id="display-area">
    <div id="shown" class="empty">ここに筆談内容が表示されます</div>
  </div>

  <!-- 下段：操作パネル -->
  <div id="control-area">
    <!-- 定型文横スクロールバー -->
    <div class="chips-container" id="chips"></div>

    <!-- コントロールボタン行 -->
    <div class="row">
      <button id="micBtn">🎤 話す間押し続ける (音声入力)</button>
      <button id="clearBtn">画面消去</button>
      <span class="status-text" id="statusMsg">待機中</span>
      <span class="sp"></span>
      <button id="exitBtn">終了</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY_PH = 'hitsudan_android_phrases_v2';
  var $=function(id){return document.getElementById(id)};
  
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  var shown=$('shown');
  var micBtn=$('micBtn');
  var statusMsg=$('statusMsg');
  
  var hasActiveText = false;

  var defaultPhrases = [
    'はい', 'いいえ', '少々お待ちください', 
    '痛みはありますか？', 'これから検査を行います', 
    'レンズを入れ替えます', 'まっすぐ前を見てください', 
    'お疲れ様でした。終わりました。'
  ];
  var phrases = lsGet(KEY_PH, defaultPhrases);

  function showText(text, isNew) {
    if(!text || !text.trim()) {
      shown.textContent = 'ここに筆談内容が表示されます';
      shown.classList.add('empty');
      hasActiveText = false;
    } else {
      shown.textContent = text.trim();
      shown.classList.remove('empty');
      hasActiveText = true;
    }
  }

  function renderChips() {
    var container = $('chips');
    container.innerHTML = '';
    phrases.forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = p;
      btn.onclick = function() {
        showText(p, true);
      };
      container.appendChild(btn);
    });

    var addBtn = document.createElement('button');
    addBtn.className = 'chip';
    addBtn.style.background = '#0d47a1';
    addBtn.textContent = '＋ 定型文追加';
    addBtn.onclick = function() {
      var newP = prompt('追加する定型文を入力してください:');
      if(newP && newP.trim()) {
        phrases.push(newP.trim());
        lsSet(KEY_PH, phrases);
        renderChips();
      }
    };
    container.appendChild(addBtn);
  }

  function formatSentence(text) {
    text = text.trim();
    if(!text) return '';
    var lastChar = text.slice(-1);
    if(lastChar !== '。' && lastChar !== '？' && lastChar !== '!' && lastChar !== '！') {
      var questionWords = ['か', 'どう', '誰', '何', 'どこ', 'いつ', 'なぜ', 'どうして', 'いかが', 'ありますか', '痛いですか', '見えますか'];
      var isQuestion = questionWords.some(function(w){ return text.includes(w); });
      if(isQuestion) {
        text += '？';
      } else {
        text += '。';
      }
    }
    return text;
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;

  if(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
      micBtn.classList.add('recording');
      micBtn.textContent = '🔴 録音中... (話して指を離してください)';
      statusMsg.textContent = '録音中';
    };

    recognition.onresult = function(event) {
      var transcript = event.results[0][0].transcript;
      var formatted = formatSentence(transcript);
      showText(formatted, true);
    };

    recognition.onerror = function(event) {
      console.error(event.error);
      statusMsg.textContent = 'エラー: ' + event.error;
    };

    recognition.onend = function() {
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤 話す間押し続ける (音声入力)';
      statusMsg.textContent = '待機中';
    };

    var isPressing = false;

    function startRec(e) {
      e.preventDefault();
      if(isPressing) return;
      isPressing = true;

      if(hasActiveText) {
        showText('', true);
      }

      try {
        recognition.start();
      } catch(err) {}
    }

    function endRec(e) {
      e.preventDefault();
      if(!isPressing) return;
      isPressing = false;
      try {
        recognition.stop();
      } catch(err) {}
    }

    micBtn.addEventListener('mousedown', startRec);
    micBtn.addEventListener('mouseup', endRec);
    micBtn.addEventListener('mouseleave', endRec);

    micBtn.addEventListener('touchstart', startRec, {passive: false});
    micBtn.addEventListener('touchend', endRec, {passive: false});
    micBtn.addEventListener('touchcancel', endRec, {passive: false});

  } else {
    micBtn.disabled = true;
    micBtn.textContent = '🎤 音声非対応ブラウザ';
  }

  $('clearBtn').onclick = function() {
    showText('', true);
  };

  $('exitBtn').onclick = function() {
    if(confirm('終了しますか？')) {
      window.close();
      location.href = 'about:blank';
    }
  };

  document.body.addEventListener('click', function() {
    if(!document.fullscreenElement) {
      var elem = document.documentElement;
      if(elem.requestFullscreen) {
        elem.requestFullscreen().catch(function(){});
      }
    }
  }, {once: true});

  renderChips();
})();
</script>
</body>
</html>
