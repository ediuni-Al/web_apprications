<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード読み取り</title>
    <!-- QRコード読み取り用ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            /* ライトモード変数 */
            --md-bg: #f5fafd;
            --md-primary: #0077b6;
            --md-on-surface: #1a1c1e;
            --md-surface-variant: #e1e8ed;
            --md-container: #ffffff;
            --font-main: 13px;
        }

        /* ダークモード変数 */
        [data-theme="dark"] {
            --md-bg: #1a1c1e;
            --md-primary: #76d1ff;
            --md-on-surface: #e2e2e6;
            --md-surface-variant: #41484d;
            --md-container: #2d3135;
        }

        body {
            background-color: var(--md-bg);
            color: var(--md-on-surface);
            font-family: "Google Sans", "BIZ UDPGothic", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: var(--font-main);
            transition: background-color 0.3s ease;
        }

        .container {
            width: 95%;
            max-width: 480px;
            padding: 20px 0;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--md-primary);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--md-primary);
            margin: 0;
        }

        .header-btn {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--md-primary);
            background: transparent;
            color: var(--md-primary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .header-btn:hover {
            background: var(--md-primary);
            color: var(--md-container);
        }

        /* スキャナー本体 */
        .scanner-card {
            background: var(--md-container);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        /* エラーメッセージ */
        #error-msg {
            display: none;
            color: #e76f51;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 10px 0;
        }

        /* 読み取り結果表示エリア */
        #qr-result-container {
            display: none;
            margin-top: 10px;
            flex-direction: column;
            gap: 10px;
        }
        #qr-result-text {
            width: 100%;
            height: 100px;
            background: var(--md-bg);
            color: var(--md-on-surface);
            border: 1px solid var(--md-surface-variant);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .copy-btn {
            padding: 8px 16px;
            background: var(--md-primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            flex: 1;
        }
        .rescan-btn {
            padding: 8px 16px;
            background: #e76f51;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* コピー成功トースト通知 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #2a9d8f;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            z-index: 1001;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.0s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>QRコード読み取り</h1>
        <button class="header-btn" id="theme-toggle">
            <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
        </button>
    </header>

    <div class="scanner-card">
        <div id="reader"></div>
        <div id="error-msg"></div>

        <!-- 読み取り結果表示エリア -->
        <div id="qr-result-container">
            <textarea id="qr-result-text" readonly placeholder="読み取り結果がここに表示されます"></textarea>
        </div>

        <div class="btn-group">
            <button class="copy-btn" id="qr-copy-btn" style="display: none;">📋 コピー</button>
            <button class="rescan-btn" id="qr-rescan-btn" style="display: none;">再読み取り</button>
        </div>
    </div>
</div>

<!-- コピー成功時のトースト通知 -->
<div id="toast">QRコードの内容をコピーしました！</div>

<script>
    // --- テーマ切替 ---
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const htmlElement = document.documentElement;

    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') {
        htmlElement.setAttribute('data-theme', 'dark');
        updateToggleUI(true);
    }

    themeToggle.addEventListener('click', () => {
        const isDark = htmlElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            htmlElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            updateToggleUI(false);
        } else {
            htmlElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            updateToggleUI(true);
        }
    });

    function updateToggleUI(isDark) {
        themeIcon.textContent = isDark ? '☀️' : '🌙';
        themeText.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }

    // --- QRコード読み取り機能 ---
    const qrCopyBtn = document.getElementById('qr-copy-btn');
    const qrRescanBtn = document.getElementById('qr-rescan-btn');
    const qrResultContainer = document.getElementById('qr-result-container');
    const qrResultText = document.getElementById('qr-result-text');
    const readerDiv = document.getElementById('reader');
    const errorMsg = document.getElementById('error-msg');
    const toast = document.getElementById('toast');
    let html5QrCode = null;

    function showToast(message) {
        toast.textContent = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2300);
    }

    // カメラのみ停止
    function stopCameraOnly() {
        if (html5QrCode && html5QrCode.isScanning) {
            return html5QrCode.stop().then(() => {
                html5QrCode.clear();
            }).catch(err => {
                console.error("Camera stop error:", err);
            });
        }
        return Promise.resolve();
    }

    // スキャン開始
    function startScan() {
        // UIの初期化
        readerDiv.style.display = 'block';
        errorMsg.style.display = 'none';
        qrResultContainer.style.display = 'none';
        qrCopyBtn.style.display = 'none';
        qrRescanBtn.style.display = 'none';
        qrResultText.value = '';

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start(
            { facingMode: "environment" }, // 外側カメラを使用
            config,
            (decodedText) => {
                // 読み取り成功時：カメラを即座にストップ
                stopCameraOnly();

                // テキスト表示エリアに入力し表示切替
                qrResultText.value = decodedText;
                readerDiv.style.display = 'none';
                qrResultContainer.style.display = 'flex';
                qrCopyBtn.style.display = 'block';
                qrRescanBtn.style.display = 'block';
            },
            () => {
                // スキャン中のエラー（無視）
            }
        ).catch(err => {
            console.error(err);
            readerDiv.style.display = 'none';
            errorMsg.textContent = "カメラを起動できませんでした（ブラウザのカメラ権限やHTTPS接続をご確認ください）。";
            errorMsg.style.display = 'block';
            qrRescanBtn.style.display = 'block';
        });
    }

    // コピーボタンが押された時の処理
    qrCopyBtn.addEventListener('click', () => {
        const textToCopy = qrResultText.value;
        if (!textToCopy) return;

        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast("コピーしました！ページを閉じます...");

            // 少し遅延させてからページ（タブ）を閉じる
            setTimeout(() => {
                window.close();
                // window.close()がブロックされた場合（直接開かれたタブ等）はそのまま残る
            }, 500);
        }).catch(() => {
            showToast("コピーに失敗しました");
        });
    });

    // 再読み取り
    qrRescanBtn.addEventListener('click', () => {
        stopCameraOnly().then(startScan);
    });

    // ページを閉じる・隠すときにカメラを止める
    window.addEventListener('pagehide', stopCameraOnly);

    // ページを開いたらすぐにスキャン開始
    window.addEventListener('load', startScan);
</script>

</body>
</html>
